<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Steering loss weight curve</title>
  <desc id="desc">A line chart showing how absolute steering target increases the weighted MSE loss multiplier from 1x near zero steering to 10x at full steering.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#4b5563"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 25px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 15px Arial, sans-serif; fill: #4b5563; }
      .axis { stroke: #94a3b8; stroke-width: 2; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .tick { font: 12px Arial, sans-serif; fill: #64748b; }
      .label { font: 700 15px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #475569; }
      .formula { font: 700 14px Arial, sans-serif; fill: #0f766e; }
      .area { fill: #cffafe; opacity: 0.85; }
      .curve { stroke: #0891b2; stroke-width: 4; fill: none; stroke-linejoin: round; stroke-linecap: round; }
      .dot { fill: #f97316; stroke: #ffffff; stroke-width: 3; }
      .callout { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .arrow { stroke: #4b5563; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="420" rx="14"/>
  <text class="title" x="44" y="48">Steering Loss Weight</text>
  <text class="subtitle" x="44" y="74">The weighted MSE keeps straight-driving errors visible, then raises the cost of missing larger steering targets.</text>
  <text class="formula" x="44" y="98">weight = 10 ** (abs(target_steer) / 127)</text>

  <line class="grid" x1="110" y1="320" x2="850" y2="320"/>
  <line class="grid" x1="110" y1="276" x2="850" y2="276"/>
  <line class="grid" x1="110" y1="232" x2="850" y2="232"/>
  <line class="grid" x1="110" y1="188" x2="850" y2="188"/>
  <line class="grid" x1="110" y1="144" x2="850" y2="144"/>
  <line class="grid" x1="110" y1="120" x2="850" y2="120"/>
  <line class="axis" x1="110" y1="320" x2="850" y2="320"/>
  <line class="axis" x1="110" y1="120" x2="110" y2="320"/>

  <text class="tick" x="82" y="324">1x</text>
  <text class="tick" x="82" y="280">3x</text>
  <text class="tick" x="82" y="236">5x</text>
  <text class="tick" x="82" y="192">7x</text>
  <text class="tick" x="82" y="148">9x</text>
  <text class="tick" x="78" y="124">10x</text>
  <text class="tick" x="106" y="342">0</text>
  <text class="tick" x="164" y="342">10</text>
  <text class="tick" x="278" y="342">30</text>
  <text class="tick" x="476" y="342">64</text>
  <text class="tick" x="838" y="342">127</text>
  <text class="label" x="386" y="382">abs(target_steer)</text>
  <text class="label" transform="translate(40 248) rotate(-90)">loss multiplier</text>

  <path class="area" d="M 110.0 320.0 L 110.0 320.0 L 115.8 319.6 L 121.7 319.2 L 133.3 318.3 L 145.0 317.4 L 156.6 316.5 L 168.3 315.6 L 179.9 314.6 L 191.6 313.6 L 203.2 312.5 L 214.9 311.4 L 226.5 310.3 L 238.2 309.1 L 249.8 307.9 L 261.5 306.6 L 273.1 305.3 L 284.8 303.9 L 296.5 302.5 L 308.1 301.1 L 319.8 299.5 L 331.4 298.0 L 343.1 296.3 L 354.7 294.6 L 366.4 292.9 L 378.0 291.1 L 389.7 289.2 L 401.3 287.2 L 413.0 285.2 L 424.6 283.1 L 436.3 280.9 L 448.0 278.6 L 459.6 276.3 L 471.3 273.8 L 482.9 271.3 L 494.6 268.7 L 506.2 266.0 L 517.9 263.2 L 529.5 260.2 L 541.2 257.2 L 552.8 254.1 L 564.5 250.8 L 576.1 247.4 L 587.8 243.9 L 599.4 240.3 L 611.1 236.6 L 622.8 232.6 L 634.4 228.6 L 646.1 224.4 L 657.7 220.1 L 669.4 215.5 L 681.0 210.9 L 692.7 206.0 L 704.3 201.0 L 716.0 195.8 L 727.6 190.4 L 739.3 184.8 L 750.9 178.9 L 762.6 172.9 L 774.3 166.7 L 785.9 160.2 L 797.6 153.5 L 809.2 146.5 L 820.9 139.3 L 832.5 131.8 L 844.2 124.0 L 850.0 120.0 L 850.0 320.0 Z"/>
  <path class="curve" d="M 110.0 320.0 L 115.8 319.6 L 121.7 319.2 L 133.3 318.3 L 145.0 317.4 L 156.6 316.5 L 168.3 315.6 L 179.9 314.6 L 191.6 313.6 L 203.2 312.5 L 214.9 311.4 L 226.5 310.3 L 238.2 309.1 L 249.8 307.9 L 261.5 306.6 L 273.1 305.3 L 284.8 303.9 L 296.5 302.5 L 308.1 301.1 L 319.8 299.5 L 331.4 298.0 L 343.1 296.3 L 354.7 294.6 L 366.4 292.9 L 378.0 291.1 L 389.7 289.2 L 401.3 287.2 L 413.0 285.2 L 424.6 283.1 L 436.3 280.9 L 448.0 278.6 L 459.6 276.3 L 471.3 273.8 L 482.9 271.3 L 494.6 268.7 L 506.2 266.0 L 517.9 263.2 L 529.5 260.2 L 541.2 257.2 L 552.8 254.1 L 564.5 250.8 L 576.1 247.4 L 587.8 243.9 L 599.4 240.3 L 611.1 236.6 L 622.8 232.6 L 634.4 228.6 L 646.1 224.4 L 657.7 220.1 L 669.4 215.5 L 681.0 210.9 L 692.7 206.0 L 704.3 201.0 L 716.0 195.8 L 727.6 190.4 L 739.3 184.8 L 750.9 178.9 L 762.6 172.9 L 774.3 166.7 L 785.9 160.2 L 797.6 153.5 L 809.2 146.5 L 820.9 139.3 L 832.5 131.8 L 844.2 124.0 L 850.0 120.0"/>

  <circle class="dot" cx="110.0" cy="320.0" r="6"/>
  <circle class="dot" cx="168.3" cy="315.6" r="6"/>
  <circle class="dot" cx="482.9" cy="271.3" r="6"/>
  <circle class="dot" cx="850.0" cy="120.0" r="6"/>

  <rect class="callout" x="132" y="274" width="158" height="54"/>
  <text class="small" x="146" y="296">0 steering</text>
  <text class="formula" x="146" y="316">1.00x multiplier</text>
  <path class="arrow" d="M132 306 L116 319"/>

  <rect class="callout" x="188" y="212" width="168" height="54"/>
  <text class="small" x="202" y="234">10 steering</text>
  <text class="formula" x="202" y="254">1.20x multiplier</text>
  <path class="arrow" d="M188 242 L170 229"/>

  <rect class="callout" x="510" y="154" width="168" height="54"/>
  <text class="small" x="524" y="176">64 steering</text>
  <text class="formula" x="524" y="196">3.19x multiplier</text>
  <path class="arrow" d="M510 184 L486 155"/>

  <rect class="callout" x="690" y="104" width="180" height="54"/>
  <text class="small" x="704" y="126">127 steering</text>
  <text class="formula" x="704" y="146">10.00x multiplier</text>
  <path class="arrow" d="M850 150 L850 128"/>

  <text class="small" x="278" y="404">The multiplier is applied to squared steering error before taking the batch mean.</text>
</svg>
